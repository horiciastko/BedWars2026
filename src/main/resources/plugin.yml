name: BedWars
version: ${project.version}
main: me.horiciastko.bedwars.BedWars
authors: [Horiciastko]
api-version: '1.13'
softdepend: [PlaceholderAPI, Citizens, Vault]

commands:
  bw:
    description: Main BedWars command
    aliases: [bedwars]
    usage: /bw <subcommand>
  lobby:
    description: Return to the BedWars lobby (standalone alias for /bw lobby)
    usage: /lobby
  party:
    description: Manage your BedWars party (standalone alias for /bw party)
    usage: /party <invite|accept|leave|kick|list|disband>
  join:
    description: Join a BedWars arena (standalone alias for /bw join)
    usage: /join [arena/group]
  leave:
    description: Leave the current BedWars arena (standalone alias for /bw leave)
    usage: /leave
  rejoin:
    description: Rejoin your recent BedWars arena (standalone alias for /bw rejoin)
    usage: /rejoin
  stats:
    description: View BedWars stats (standalone alias for /bw stats)
    usage: /stats [player]

permissions:
  bedwars.use:
    description: Allows the usage of basic BedWars commands like /bw join or /bw leave.
    default: true
  bedwars.admin:
    description: Full administrator access to all plugin features and commands.
    default: op
  bedwars.setup:
    description: Ability to create, edit, and manage BedWars arenas.
    default: op
  bedwars.command.rejoin:
    description: Allows the player to rejoin a game they recently disconnected from.
    default: true
  bedwars.command.reload:
    description: Allows the player to reload the plugin configuration.
    default: op
  bedwars.command.lang:
    description: Allows administrators to change the global language of the plugin.
    default: op
