############################################################
#                                                          #
#                BedWars Advanced Configuration            #
#                                                          #
############################################################

# Database settings
# We support SQLite for simple setups and MySQL for multi-lobby networks.
database:
  # Type of database: "sqlite" or "mysql"
  type: "sqlite"

  # SQLite settings (ignored if type is "mysql")
  sqlite:
    # Main/core database file (players, stats, settings, quickbuy)
    file: "database.db"

    # Optional split DB files to protect arena/NPC data from main DB resets.
    # When disabled, plugin uses the main file above for everything.
    split:
      arenas-enabled: true
      arenas-file: "arenas.db"
      npcs-enabled: true
      npcs-file: "npcs.db"
  
  # MySQL settings (ignored if type is "sqlite")
  mysql:
    host: "localhost"
    port: 3306
    database: "bedwars"
    username: "root"
    password: ""
    pool:
      maximum-pool-size: 10
      minimum-idle: 5
      max-lifetime: 1800000 # 30 mins
      connection-timeout: 5000 # 5 seconds

# Server Identification
server:
  ip: "play.yourserver.net"
  id: "1"
  version: "1.1.3"

# These appear above team beds to show their status.
# Hologram text is defined in Languages/*/messages.yml (hologram-team-line1, hologram-team-line2, hologram-eliminated-line1)
holographic-beds:
  enabled: true

# Game settings
game:
  # Timers (seconds)
  lobby-countdown: 30
  start-countdown: 10
  min-players-to-start: 2
  rejoin-time: 60 # seconds to rejoin if disconnected
  
  # Visual & Technical
  remove-waiting-lobby: true
  # Radius (in blocks) used to clear the waiting lobby structure when the game starts.
  # Only applies when Lobby Remove Pos1/Pos2 are NOT set via /bw admin arena setup.
  # For best results, set Pos1 and Pos2 in the arena setup GUI instead of relying on radius.
  waiting-lobby-radius: 20
  void-y-level: -10 # Y level below which players die immediately
  
  # Explosion settings
  # Fine-tune the "BedWars feel" of explosions.
  pvp-cooldown: true # Set to true to ENABLE 1.9+ cooldowns, false for 1.8 spam-clicking
  # Random/fair team assignment tie-breaker. If OFF, team fill uses deterministic order.
  random-team-assignment: true
  tnt:
    jump-power: 2.5
    damage-enabled: false
    damage-amount: 2.0
    team-damage-amount: 1.0 # Damage dealt to teammates (only when prevent-team-explosion-damage is false)
    timer-enabled: true
  fireball:
    jump-power: 2.0
    damage-enabled: true
    damage-amount: 4.0
    team-damage-amount: 2.0 # Damage dealt to teammates (only when prevent-team-explosion-damage is false)
  
  # Combat & Protection
  prevent-own-mob-damage: true # Protect players from being attacked by their own golems/bedbugs
  prevent-team-explosion-damage: true # Prevent TNT/fireball from damaging teammates (set to false to allow friendly explosion fire)
  
# Language settings
# Note: You can change this via /bw admin lang <iso>
default-language: "en"

# Standalone Command Shortcuts
# When enabled, players can use these commands without the /bw prefix.
# /bw join, /bw leave, /bw lobby, /bw party, /bw rejoin and /bw stats always work
# regardless of these settings.
commands:
  shortcuts:
    lobby: true   # /lobby  (shortcut for /bw lobby)
    party: true   # /party  (shortcut for /bw party)
    join: true    # /join   (shortcut for /bw join)
    leave: true   # /leave  (shortcut for /bw leave)
    rejoin: true  # /rejoin (shortcut for /bw rejoin)
    stats: true   # /stats  (shortcut for /bw stats)

# World Backup Settings
# Backup folders are created so that arenas can be restored after each game.
world-backup:
  # Set to false to completely disable backup creation and restoration.
  enabled: true
  # Sub-folder (relative to the server root) where all backups are stored.
  # Default: "bw_backups"  → all backups go to  <server>/bw_backups/<worldName>_bw_backup
  folder: "bw_backups"

# Experience & Leveling System
# Moved to levels.yml for better organization and customization

# Scoreboard settings (Modern & Premium Design)
# Scoreboard lines are defined in Languages/*/messages.yml (scoreboard-lobby-lines, scoreboard-waiting-lines, scoreboard-ingame-lines)
# %date%, %event_name%, %event_time%, %teams_status%, %server_ip% are supported.
scoreboard:
  date-format: "dd/MM/yy"
  # Disable BedWars sidebar scoreboard in selected worlds (exact world names).
  # In-game arenas and arena edit mode always keep the BedWars scoreboard active.
  disabled-worlds: []
  
  # Symbols used in the scoreboard (Premium look)
  symbols:
    bed-alive: "&a&l✔"
    bed-broken: "&a%count%"
    team-dead: "&c&l✘"
    you-indicator: " &b[YOU]"

# Chat Formatting
chat-system:
  enabled: true
  # Format: [Team] [Level] Name: Message
  # Use %team%, %level%, %player%, %message%
  format: "%team% &7[%level%✫] %player%&f: %message%"

# Group Settings
# Define custom game groups here to override settings per arena group.
# You can assign an arena to a group using /bw admin arena <name> group <groupName>
# 'Default' is used if no group is set.
groups:
  Default:
    shop-file: "shop.yml"
    upgrades-file: "upgrades.yml"
  Hardcore:
    shop-file: "shop_hardcore.yml"
    upgrades-file: "upgrades_hardcore.yml"
  1v1:
    shop-file: "shop.yml" # Re-use default shop
    upgrades-file: "upgrades.yml"

# Join GUI Configuration
# Define how modes are displayed in the /bw join menu.
# Slots: 0-26 (for 3 rows)
# Display names and lore are defined in Languages/*/messages.yml
join-gui:
  rows: 3
  # If enabled, an empty WAITING arena can be reused by any mode selected in Join GUI.
  # The arena mode is set at runtime when the first player joins that mode.
  allow-multi-mode-arenas: true
  modes:
    solo:
      players-per-team: 1
      slot: 10
      material: "WHITE_BED"
    duo:
      players-per-team: 2
      slot: 12
      material: "RED_BED"
    trio:
      players-per-team: 3
      slot: 14
      material: "GREEN_BED"
    squad:
      players-per-team: 4
      slot: 16
      material: "BLUE_BED"

